<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#bgGrad1)" rx="16"/>
  <rect width="998" height="558" x="1" y="1" fill="none" stroke="#30363d" stroke-width="1.5" rx="15"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="46" fill="#161b22" rx="16"/>
  <rect x="0" y="30" width="1000" height="16" fill="#161b22"/>
  <line x1="0" y1="46" x2="1000" y2="46" stroke="#30363d" stroke-width="1"/>
  <circle cx="28" cy="23" r="6" fill="#ef4444"/>
  <circle cx="48" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="23" r="6" fill="#10b981"/>
  <text x="500" y="28" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">VoiceNote v1.2 — 极简托盘常驻与实时语音转录工作台</text>

  <!-- System Tray Preview Pill -->
  <g transform="translate(750, 10)">
    <rect width="220" height="26" rx="13" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Tray: 🟢 Listening (Silero VAD)</text>
  </g>

  <!-- Left Sidebar Controls -->
  <rect x="24" y="66" width="280" height="470" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="98" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">录音引擎与硬件配置</text>

  <!-- Config Items -->
  <g transform="translate(44, 120)">
    <text x="0" y="0" fill="#8b949e" font-size="11" font-family="'JetBrains Mono', monospace">AUDIO INPUT DEVICE</text>
    <rect x="0" y="10" width="240" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="12" y="32" fill="#c9d1d9" font-size="12" font-family="sans-serif">🎙️ 默认麦克风 (Realtek Audio)</text>
  </g>

  <g transform="translate(44, 185)">
    <text x="0" y="0" fill="#8b949e" font-size="11" font-family="'JetBrains Mono', monospace">VAD ENGINE</text>
    <rect x="0" y="10" width="240" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="12" y="32" fill="#3fb950" font-size="12" font-family="sans-serif">⚡ Silero VAD (CPU 0开销)</text>
  </g>

  <g transform="translate(44, 250)">
    <text x="0" y="0" fill="#8b949e" font-size="11" font-family="'JetBrains Mono', monospace">ASR MODEL &amp; DEVICE</text>
    <rect x="0" y="10" width="240" height="34" rx="6" fill="#0d1117" stroke="#388bfd"/>
    <text x="12" y="32" fill="#58a6ff" font-size="12" font-family="sans-serif">🚀 faster-whisper (CUDA RTF 0.18)</text>
  </g>

  <g transform="translate(44, 315)">
    <text x="0" y="0" fill="#8b949e" font-size="11" font-family="'JetBrains Mono', monospace">AUTO-ARCHIVE FORMAT</text>
    <rect x="0" y="10" width="240" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="12" y="32" fill="#d2a8ff" font-size="12" font-family="sans-serif">📁 Markdown + FLAC 归档</text>
  </g>

  <!-- Performance Badge in Sidebar -->
  <g transform="translate(44, 380)">
    <rect width="240" height="136" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="24" fill="#f0f6fc" font-size="12" font-weight="700">实时性能监控指标</text>
    <text x="14" y="52" fill="#8b949e" font-size="11">VAD 响应延迟:</text>
    <text x="226" y="52" text-anchor="end" fill="#3fb950" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&lt; 15 ms</text>
    <text x="14" y="78" fill="#8b949e" font-size="11">CUDA 吞吐因子:</text>
    <text x="226" y="78" text-anchor="end" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">0.18 RTF</text>
    <text x="14" y="104" fill="#8b949e" font-size="11">停顿断句延迟:</text>
    <text x="226" y="104" text-anchor="end" fill="#d2a8ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">~ 0.70 s</text>
    <text x="14" y="126" fill="#8b949e" font-size="10">自检: ✅ CUDA DLL 状态正常</text>
  </g>

  <!-- Main Right Panel -->
  <rect x="324" y="66" width="652" height="470" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- Waveform Visualizer -->
  <g transform="translate(348, 86)">
    <rect width="604" height="110" rx="8" fill="#0d1117" stroke="#21262d"/>
    <text x="16" y="24" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">LIVE AUDIO STREAM (16kHz PCM · STEREO VAD ACTIVE)</text>
    <circle cx="580" cy="20" r="4" fill="#10b981"/>
    
    <!-- Waveform bars -->
    <path d="M 20 65 Q 40 30, 60 65 T 100 65 T 140 35 T 180 85 T 220 50 T 260 80 T 300 25 T 340 95 T 380 40 T 420 80 T 460 30 T 500 85 T 540 50 T 580 65" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20 65 Q 50 80, 80 65 T 140 65 T 200 45 T 260 75 T 320 55 T 380 75 T 440 45 T 500 70 T 560 65" 
          fill="none" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    
    <text x="16" y="96" fill="#3fb950" font-family="'JetBrains Mono', monospace" font-size="10">● 人声触发检测阈值: 0.65 (Active Speech Chunk Captured)</text>
  </g>

  <!-- Live Transcript Log Window -->
  <g transform="translate(348, 214)">
    <rect width="604" height="302" rx="8" fill="#0d1117" stroke="#21262d"/>
    <rect width="604" height="32" rx="8" fill="#161b22"/>
    <rect y="20" width="604" height="12" fill="#161b22"/>
    <text x="16" y="22" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">📄 自动转录与按日期归档记录 (Today: 2026-10-16.md)</text>

    <!-- Transcript Entries -->
    <g transform="translate(16, 52)">
      <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">[10:14:22]</text>
      <text x="80" y="0" fill="#388bfd" font-family="'JetBrains Mono', monospace" font-size="11">VAD Triggered</text>
      <text x="190" y="0" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">Duration: 3.4s · RTF: 0.17</text>
      <text x="0" y="20" fill="#f0f6fc" font-family="sans-serif" font-size="13">“今天准备把 NoteFlow 的 SQLite FTS5 模糊索引算法优化一下，测试万级笔记响应速度。”</text>
      <text x="0" y="38" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="10">↳ Saved to: recordings/2026-10-16/chunk_001.flac + 2026-10-16.md</text>
    </g>

    <line x1="16" y1="112" x2="588" y2="112" stroke="#21262d"/>

    <g transform="translate(16, 136)">
      <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">[10:35:48]</text>
      <text x="80" y="0" fill="#388bfd" font-family="'JetBrains Mono', monospace" font-size="11">VAD Triggered</text>
      <text x="190" y="0" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">Duration: 4.8s · RTF: 0.18</text>
      <text x="0" y="20" fill="#f0f6fc" font-family="sans-serif" font-size="13">“TeamFlow 平台课设协同测试通过，G6 知识图谱能够实时反映团队成员之间的依赖关系。”</text>
      <text x="0" y="38" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="10">↳ Saved to: recordings/2026-10-16/chunk_002.flac + 2026-10-16.md</text>
    </g>

    <line x1="16" y1="196" x2="588" y2="196" stroke="#21262d"/>

    <g transform="translate(16, 220)">
      <text x="0" y="0" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">[11:02:15]</text>
      <text x="80" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Live Transcribing...</text>
      <text x="0" y="20" fill="#58a6ff" font-family="sans-serif" font-size="13">“准备将 VoiceNote 常驻后台开机自启，实现想到什么直接说、零唤醒成本记录...”</text>
      <rect x="520" y="8" width="6" height="14" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
