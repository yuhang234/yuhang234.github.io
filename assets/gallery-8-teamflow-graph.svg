<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bgGrad8)" rx="16"/>
  <rect width="798" height="518" x="1" y="1" fill="none" stroke="#252d3d" stroke-width="1.5" rx="15"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" fill="#121620" rx="16"/>
  <rect x="0" y="26" width="800" height="16" fill="#121620"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#252d3d" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="400" y="26" text-anchor="middle" fill="#8e95a5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">TeamFlow — AntV G6 动态任务·成员·交付四维知识图谱</text>

  <!-- Graph Canvas Area -->
  <!-- Legend Top Left -->
  <g transform="translate(32, 60)" font-family="sans-serif" font-size="11">
    <rect width="180" height="96" rx="8" fill="#161c28" stroke="#252d3d"/>
    <circle cx="20" cy="24" r="5" fill="#3b82f6"/>
    <text x="34" y="28" fill="#f0f6fc">项目核心 (Project)</text>
    <circle cx="20" cy="46" r="5" fill="#8b5cf6"/>
    <text x="34" y="50" fill="#f0f6fc">协同成员 (Member)</text>
    <circle cx="20" cy="68" r="5" fill="#10b981"/>
    <text x="34" y="72" fill="#f0f6fc">开发任务 (Task)</text>
    <circle cx="20" cy="90" r="5" fill="#f59e0b"/>
    <text x="34" y="94" fill="#f0f6fc">交付产物 (Artifact)</text>
  </g>

  <!-- Network Connecting Lines -->
  <g stroke="#30363d" stroke-width="1.5">
    <!-- Center to Members -->
    <line x1="400" y1="270" x2="250" y2="180" stroke="#388bfd" stroke-dasharray="4 2"/>
    <line x1="400" y1="270" x2="550" y2="180" stroke="#388bfd" stroke-dasharray="4 2"/>
    <line x1="400" y1="270" x2="400" y2="400" stroke="#388bfd" stroke-dasharray="4 2"/>

    <!-- Member to Tasks -->
    <line x1="250" y1="180" x2="140" y2="240" stroke="#8b5cf6"/>
    <line x1="250" y1="180" x2="160" y2="340" stroke="#8b5cf6"/>
    <line x1="550" y1="180" x2="660" y2="220" stroke="#8b5cf6"/>
    <line x1="550" y1="180" x2="640" y2="320" stroke="#8b5cf6"/>

    <!-- Task to Deliverables -->
    <line x1="160" y1="340" x2="270" y2="440" stroke="#10b981"/>
    <line x1="400" y1="400" x2="400" y2="470" stroke="#10b981"/>
    <line x1="640" y1="320" x2="580" y2="440" stroke="#10b981"/>

    <!-- Dynamic interaction pulses -->
    <line x1="250" y1="180" x2="400" y2="270" stroke="#388bfd" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Graph Nodes -->
  <!-- Central Node: Project Root -->
  <g transform="translate(400, 270)" filter="url(#nodeGlow)">
    <circle r="44" fill="#1e293b" stroke="#388bfd" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="20">🎓</text>
    <text x="0" y="14" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="700">软件工程课设</text>
    <text x="0" y="26" text-anchor="middle" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="9">ROOT</text>
  </g>

  <!-- Member 1: 谢雨航 (Lead) -->
  <g transform="translate(250, 180)">
    <circle r="34" fill="#1e1e38" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-size="16">👨‍💻</text>
    <text x="0" y="12" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10" font-weight="700">谢雨航 (组长)</text>
    <text x="0" y="23" text-anchor="middle" fill="#d2a8ff" font-family="'JetBrains Mono', monospace" font-size="8">Lead / Dev</text>
  </g>

  <!-- Member 2: 张同学 -->
  <g transform="translate(550, 180)">
    <circle r="30" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="14">👩‍💻</text>
    <text x="0" y="12" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10">张同学</text>
  </g>

  <!-- Member 3: 李同学 -->
  <g transform="translate(400, 400)">
    <circle r="28" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="14">👨‍💻</text>
    <text x="0" y="12" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10">李同学</text>
  </g>

  <!-- Task Nodes -->
  <g transform="translate(140, 240)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#102a20" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="600">G6 图谱核心</text>
  </g>

  <g transform="translate(160, 340)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#102a20" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="600">AI 助手集成</text>
  </g>

  <g transform="translate(660, 220)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#102a20" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="600">后端接口联调</text>
  </g>

  <g transform="translate(640, 320)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#102a20" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="600">测试用例编写</text>
  </g>

  <!-- Artifact Nodes -->
  <g transform="translate(270, 440)">
    <circle r="20" fill="#2c2010" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="12">📄</text>
    <text x="0" y="32" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="9">设计文档.pdf</text>
  </g>

  <g transform="translate(400, 470)">
    <circle r="20" fill="#2c2010" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="12">📦</text>
    <text x="0" y="32" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="9">发布产物.zip</text>
  </g>

  <g transform="translate(580, 440)">
    <circle r="20" fill="#2c2010" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="12">📊</text>
    <text x="0" y="32" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="9">测试报告.md</text>
  </g>

  <!-- Live Pulse Tag -->
  <g transform="translate(610, 60)">
    <rect width="156" height="28" rx="14" fill="#161c28" stroke="#10b981" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" fill="#3fb950" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">力导向布局实时平衡</text>
  </g>
</svg>
