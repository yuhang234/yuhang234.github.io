      <circle cx="6" cy="38" r="4" fill="#3fb950"/>
      <text x="18" y="42" fill="#c9d1d9"><tspan font-weight="700" fill="#3fb950">派生 SQLite FTS5：</tspan>数据库仅充当只读加速索引层，即使数据库损坏或被误删，启动时可 100% 毫秒级全量自愈重建。</text>

      <circle cx="6" cy="66" r="4" fill="#d2a8ff"/>
